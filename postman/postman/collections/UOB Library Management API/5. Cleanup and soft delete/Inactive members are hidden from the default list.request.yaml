$kind: http-request
url: "{{baseUrl}}/api/members?search={{runId}}"
method: GET
queryParams:
  search: "{{runId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200 OK", () => pm.response.to.have.status(200));
      pm.test("Only 2 active members remain from this run", () => pm.expect(pm.response.json().totalCount).to.eql(2));
    language: text/javascript
order: 7000
