$kind: http-request
url: "{{baseUrl}}/api/members?search={{runId}}&includeInactive=true"
method: GET
queryParams:
  search: "{{runId}}"
  includeInactive: "true"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200 OK", () => pm.response.to.have.status(200));
      pm.test("All 3 members returned", () => pm.expect(pm.response.json().totalCount).to.eql(3));
    language: text/javascript
order: 8000
