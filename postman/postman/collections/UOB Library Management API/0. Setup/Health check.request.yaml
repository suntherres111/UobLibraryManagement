$kind: http-request
description: Run this first. It also generates a new runId used to make test data unique.
url: "{{baseUrl}}/health"
method: GET
scripts:
  - type: beforeRequest
    code: |-
      // New run id each time the collection runs, so test data never clashes with earlier runs
      pm.collectionVariables.set("runId", String(Date.now()).slice(-8));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status is 200 OK", () => pm.response.to.have.status(200));
      pm.test("API reports Healthy", () => pm.expect(pm.response.text()).to.include("Healthy"));
    language: text/javascript
order: 1000
