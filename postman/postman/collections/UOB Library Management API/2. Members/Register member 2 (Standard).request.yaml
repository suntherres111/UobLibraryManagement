$kind: http-request
url: "{{baseUrl}}/api/members"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "firstName": "Bob",
      "lastName": "Postman",
      "email": "{{member2Email}}",
      "phoneNumber": "+60123456789",
      "membershipType": "Standard"
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set("member2Email", "bob.postman" + pm.collectionVariables.get("runId") + "@example.com");
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status is 201 Created", () => pm.response.to.have.status(201));
      if (pm.response.code < 300) { pm.collectionVariables.set("member2Id", pm.response.json().id); }
    language: text/javascript
order: 2000
