$kind: http-request
url: "{{baseUrl}}/api/members/{{member1Id}}"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 409 Conflict", () => pm.response.to.have.status(409));
      pm.test("Error code is MEMBER_HAS_ACTIVE_LOANS", () => pm.expect(pm.response.json().code).to.eql("MEMBER_HAS_ACTIVE_LOANS"));
      pm.test("Response is ProblemDetails", () => {
          const j = pm.response.json();
          pm.expect(j).to.have.property("title");
          pm.expect(j).to.have.property("traceId");
      });
    language: text/javascript
order: 4000
