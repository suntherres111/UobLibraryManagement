$kind: http-request
description: "Rejected automatically by [ApiController] before reaching the service: ValidationProblemDetails with an errors object."
url: "{{baseUrl}}/api/books"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "isbn": "9781234567897",
      "title": "",
      "author": "Someone",
      "publishedYear": 2024,
      "totalCopies": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400 Bad Request", () => pm.response.to.have.status(400));
      pm.test("Field-level validation errors returned", () => pm.expect(pm.response.json()).to.have.property("errors"));
    language: text/javascript
order: 16000
