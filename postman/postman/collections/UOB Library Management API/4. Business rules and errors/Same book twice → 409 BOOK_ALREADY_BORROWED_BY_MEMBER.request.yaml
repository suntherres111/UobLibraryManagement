$kind: http-request
description: Member 1 already holds book B. This rule is checked before availability, so this is the code you get.
url: "{{baseUrl}}/api/loans"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "bookId": {{bookBId}},
      "memberId": {{member1Id}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 409 Conflict", () => pm.response.to.have.status(409));
      pm.test("Error code is BOOK_ALREADY_BORROWED_BY_MEMBER", () => pm.expect(pm.response.json().code).to.eql("BOOK_ALREADY_BORROWED_BY_MEMBER"));
      pm.test("Response is ProblemDetails", () => {
          const j = pm.response.json();
          pm.expect(j).to.have.property("title");
          pm.expect(j).to.have.property("traceId");
      });
    language: text/javascript
order: 3000
