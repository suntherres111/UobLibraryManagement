$kind: http-request
url: "{{baseUrl}}/api/loans"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "bookId": {{bookBId}},
      "memberId": {{member1Id}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201 Created", () => pm.response.to.have.status(201));
      if (pm.response.code < 300) { pm.collectionVariables.set("loanBId", pm.response.json().id); }
    language: text/javascript
order: 1000
