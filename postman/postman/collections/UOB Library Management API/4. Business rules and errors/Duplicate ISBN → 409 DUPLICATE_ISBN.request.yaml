$kind: http-request
url: "{{baseUrl}}/api/books"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "isbn": "{{bookAIsbn}}",
      "title": "Postman Test Book Duplicate {{runId}}",
      "author": "Postman Runner",
      "publisher": "Test Publisher",
      "genre": "Software Engineering",
      "publishedYear": 2024,
      "totalCopies": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 409 Conflict", () => pm.response.to.have.status(409));
      pm.test("Error code is DUPLICATE_ISBN", () => pm.expect(pm.response.json().code).to.eql("DUPLICATE_ISBN"));
      pm.test("Response is ProblemDetails", () => {
          const j = pm.response.json();
          pm.expect(j).to.have.property("title");
          pm.expect(j).to.have.property("traceId");
      });
    language: text/javascript
order: 13000
