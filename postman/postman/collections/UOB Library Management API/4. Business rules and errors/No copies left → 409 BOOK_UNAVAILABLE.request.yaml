$kind: http-request
description: Member 2 tries to borrow book B while member 1 holds the only copy.
url: "{{baseUrl}}/api/loans"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "bookId": {{bookBId}},
      "memberId": {{member2Id}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 409 Conflict", () => pm.response.to.have.status(409));
      pm.test("Error code is BOOK_UNAVAILABLE", () => pm.expect(pm.response.json().code).to.eql("BOOK_UNAVAILABLE"));
      pm.test("Response is ProblemDetails", () => {
          const j = pm.response.json();
          pm.expect(j).to.have.property("title");
          pm.expect(j).to.have.property("traceId");
      });
    language: text/javascript
order: 2000
