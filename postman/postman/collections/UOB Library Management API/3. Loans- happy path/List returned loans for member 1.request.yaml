$kind: http-request
url: "{{baseUrl}}/api/loans?memberId={{member1Id}}&status=Returned"
method: GET
queryParams:
  memberId: "{{member1Id}}"
  status: Returned
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200 OK", () => pm.response.to.have.status(200));
      pm.test("One returned loan", () => pm.expect(pm.response.json().totalCount).to.eql(1));
    language: text/javascript
order: 10000
