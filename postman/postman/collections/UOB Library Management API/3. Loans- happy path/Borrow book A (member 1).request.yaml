$kind: http-request
url: "{{baseUrl}}/api/loans"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "bookId": {{bookAId}},
      "memberId": {{member1Id}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201 Created", () => pm.response.to.have.status(201));
      const j = pm.response.json();
      pm.test("Status is Active", () => pm.expect(j.status).to.eql("Active"));
      pm.test("Due date = borrow date + 14 days", () => {
          const days = (new Date(j.dueAtUtc) - new Date(j.borrowedAtUtc)) / 86400000;
          pm.expect(Math.round(days)).to.eql(14);
      });
      pm.test("Location header points to the loan", () => pm.expect(pm.response.headers.get("Location")).to.include("/api/loans/"));
      if (pm.response.code < 300) { pm.collectionVariables.set("loanId", pm.response.json().id); }
    language: text/javascript
order: 1000
