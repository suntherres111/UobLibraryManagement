$kind: http-request
url: "{{baseUrl}}/api/books/{{bookAId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200 OK", () => pm.response.to.have.status(200));
      pm.test("One copy is out (3 → 2)", () => pm.expect(pm.response.json().availableCopies).to.eql(2));
    language: text/javascript
order: 3000
